name: Mise à jour des vols

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: |
          pip install playwright beautifulsoup4
          playwright install --with-deps chromium

      - name: Lancer le scraper
        run: python scripts/scrape.py

      - name: Commit et push si changement
        run: |
          git config user.name "tlp-taxi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/flights.json
          if git diff --cached --quiet; then
            echo "Aucune modification des vols"
          else
            git commit -m "Mise à jour des vols $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publier le site sur GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
